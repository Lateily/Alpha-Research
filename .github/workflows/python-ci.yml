name: python-ci
on:
  pull_request:
    paths:
      - "experiments/**/*.py"
      - "experiments/execution_tracker/**/*.json"
      - "experiments/macro_os/**/*.json"
      - "experiments/research_funnel/**/*.json"
      # R-015 账本是 .jsonl —— 不加这条,"只改账本数据"的 PR 根本不触发本工作流,
      # 而那正是第③层唯一要把关的 diff 形态(实测:.jsonl 不匹配 *.json)
      - "experiments/execution_tracker/event_ledger.jsonl*"
      - "experiments/execution_tracker/publication_migration_events.jsonl*"
      - "scripts/**/*.py"
      - "scripts/llm/**/*.json"
      - "tests/**"
      - "docs/llm/**"
      - "docs/research/**"
      - "docs/contracts/**"
      - "public/data/v2/**"
      - "docs/research/RESEARCH_QUALITY_SCORECARD_V0.md"
      - "docs/research/contracts/**"
      - "docs/research/macro/**"
      - "docs/contracts/macro/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "experiments/AGENTS.md"
      - "scripts/llm/AGENTS.md"
      - "web/AGENTS.md"
      - "config/team-ai-workspace.v1.json"
      - "config/aios-skills.v1.json"
      - "docs/team/TEAM_AI_WORKSPACE_V1.md"
      - ".gitignore"
      - "api/**"
      - ".github/workflows/python-ci.yml"
  # 直推 main 也必须过闸 —— 0712 的 git-reset-hard 正是这个形态,
  # 而本工作流此前只有 pull_request 触发器,直推完全不受任何检查。
  push:
    branches: [main]
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AR_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # R-015 需完整历史做 git 行前缀比对
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Offline deterministic tests (zero network)
        run: python3 tests/test_engines_offline.py
      - name: LLM adapter offline tests (zero network)
        run: python3 tests/test_llm_adapter_offline.py
      - name: Promoter QC gate offline tests (zero network)
        run: python3 tests/test_promoter_qc_offline.py
      - name: Nightly v4 orchestrator selftest
        run: python3 experiments/execution_tracker/run_nightly.py --selftest
      - name: Setup promoter selftest
        run: python3 experiments/execution_tracker/setup_promoter.py --selftest
      # 账本 schema 校验:preflight 全程零网络零写入(仅读本地契约/账本文件),
      # 直接对提交进仓的真账本跑 —— 账本被改坏的 PR 在这里就红
      - name: Ledger schema preflight (offline, committed ledger)
        run: python3 experiments/execution_tracker/run_nightly.py --preflight
      - name: Contract exporter selftest
        run: python3 experiments/execution_tracker/export_contracts.py --selftest
      # 零网络守卫:monkeypatch socket 后跑完整离线套件,任何隐藏外呼当场崩溃
      - name: No-network guard (socket blocked, full offline suite)
        run: python3 tests/test_no_network_guard.py
      # ── PR-A(数据源)的两个回归锚 ──
      - name: Data-source health offline test
        env:
          AR_OFFLINE: "1"
        run: python3 tests/test_data_source_health_offline.py
      - name: News entity-matching regression (node)
        run: node tests/news-entity.test.mjs
      - name: Progress Board API and client regressions (node)
        run: |
          node tests/team-progress-api.test.mjs
          node tests/team-progress-event-api.test.mjs
          node tests/team-progress-client.test.mjs
      # ── R-014 注册 schema v2 + R-015 接线回归 ──
      # 覆盖:registry 自检 · 两条注册路径确实打戳 · 账本挂掉时登记被拒且信号不落盘
      - name: Registry schema v2 + ledger wiring regression
        run: python3 tests/test_registry_schema_v2.py
      # A transient TLS EOF previously stopped the entire 2026-08-21 nightly run.
      # Retry only transport failures; HTTP/API/schema failures remain fail-closed.
      - name: Official sample transport retry regression (offline)
        run: python3 tests/test_fund_source_transport.py
      # R-043:已发布 manifest 合法迁移。覆盖审批绑定、同锁、WAL 崩溃恢复、
      # TOCTOU、双 manifest 留档与旧 run_id 拒绝。
      - name: Publication manifest migration regression (offline)
        run: |
          python3 tests/test_publication_migration_offline.py
          python3 experiments/execution_tracker/publication_migration.py --selftest
      # AIOS Harness A-013:provider-neutral AgentAdapter 契约(零网络、零成本)
      - name: Agent adapter contract regression (offline)
        run: python3 tests/test_agent_adapter_offline.py
      # AIOS-K1:A-006/A-007/A-008 任务合同、状态重放、只读对账
      - name: AIOS K1 task registry regression (offline)
        run: python3 tests/test_ai_os_k1_offline.py
      # AIOS A-035 Phase 1:Authority/Context/P5/DONE receipt 负例与归因矩阵
      - name: AIOS A-035 Harness evaluation regression (offline)
        run: python3 tests/test_ai_os_a035_harness_eval_offline.py
      # Team AI Workspace:repo instructions, Skills, task compiler smoke,
      # runtime baseline metadata, and redacted secret/local-state hygiene.
      - name: Team AI Workspace contract and doctor regression (offline)
        run: python3 tests/test_team_ai_workspace.py
      - name: AIOS shared skill registry regression (offline)
        run: python3 tests/test_skill_registry.py
      - name: Transactional forward-return backfill selftest
        run: python3 experiments/execution_tracker/run_post_close_report.py --selftest
      # ── 夜链 v3:进程级入口 + 静态未定义名 + 产物校验 + 崩溃回滚 ──
      # B1 的 NameError 逃过了全部测试,因为没有任何测试真正执行过 main()。
      - name: Nightly v3 regression (process-level entry + artifact contracts)
        run: python3 tests/test_nightly_v3.py
      # ── 夜链 v4:双 WAL / 统一交易日 / staging 发布 / 崩溃恢复 ──
      - name: Nightly v4 adversarial regression
        run: python3 tests/test_nightly_v4_adversarial.py
      # ── 全市场研究数据支线:R-032 → R-008/R-036 ──
      # 三台生成器会在夜链中依次运行;各自 schema/哈希/覆盖率闸门也必须在 CI
      # 独立执行,避免夜链测试只验证编排而漏掉契约内部漂移。
      - name: Security registry contract selftest
        run: python3 experiments/research_funnel/security_registry.py --selftest
      - name: Feature store contract selftest
        run: python3 experiments/research_funnel/feature_store.py --selftest
      # Semiconductor positive inputs stay source-atomic and point-in-time;
      # every scoped security carries evidence or explicit DATA_BLOCKED, while
      # E1 red flags retain unconditional exclusion authority.
      - name: Semiconductor positive-input evidence regression (offline)
        run: |
          python3 tests/test_semiconductor_positive_inputs.py
          python3 tests/test_semiconductor_source_repair.py
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/semiconductor_positive_inputs_v1.task.json
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/semiconductor_source_publication_pending.task.json
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/semiconductor_daily_source_completeness.task.json
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/semiconductor_source_repair_v01.task.json
      - name: Full-market E1 event layer contract selftest
        run: python3 experiments/research_funnel/e1_event_layer.py --selftest
      # R-033/R-034/R-035:六通道独立并集、U0 状态投影、同池随机控制、
      # 以及仅由 Junyan 显式选择生成的 U4 深研队列。
      - name: Full-market research funnel closure regression (offline)
        run: |
          python3 experiments/research_funnel/funnel_pipeline.py --selftest
          python3 tests/test_research_funnel_closure.py
      # R-035 只读不可变漏斗 bundle、同日电池与本地特征仓。U1/U2 随机对照
      # 和 U3 电池分离度必须分开检验,收益不得写回候选池,claim 永久关闭。
      - name: Research funnel R-035 aligned-return evaluation (offline)
        run: python3 tests/test_research_funnel_r035.py
      # ── 漏斗夜链接入(观察期隔离):守的是接入方式,不是研究契约本身 ──
      - name: Research funnel nightly wiring regression (offline)
        run: python3 tests/test_funnel_nightly_offline.py
      # ── 三段子 DAG:候选清单 → 逐票电池/DATA_BLOCKED → 集合相等后 U3/U4 ──
      - name: Research funnel candidate-battery DAG regression (offline)
        run: python3 tests/test_funnel_dag_offline.py
      # 全市场行业 Cohort OS:所有 U0 行业保留、跨源别名显式、行业排序无 U4
      # 权限、代表由当期 U1 动态重算、相对锚与不可变历史均 fail-closed。
      - name: Industry cohort foundation regression (offline)
        run: python3 tests/test_industry_cohort_offline.py
      # launchd 首轮验收不能靠旧日志里残留的 OK 行。验收器绑定安装入口、
      # launchctl 计数/退出码、精确 run 日志段、持久 bundle 与报警旗,全程只读。
      - name: Scheduled nightly production acceptance regression (offline)
        run: python3 tests/test_nightly_acceptance_offline.py
      # U1-U5 离线闭环:冻结随机对照、同日 U3、packet-bound U4 人工复审,
      # 且 U5 在 factpack/wrong-if/因果簇完成前必须保持 DATA_BLOCKED。
      - name: Offline research closure experiment
        run: python3 tests/test_research_closure_experiment.py
      # Every U4-ready candidate receives one explicit decision. Machine-gate
      # rejects remain visible, zero selections become NO_TRADE, and selected
      # rows only project the existing offline review receipt.
      - name: Offline U4 complete-decision ledger
        run: python3 tests/test_u4_decision_ledger.py
      # U4 之后的完整离线链:研究核心、红队、双票、唯一 paper 成交引擎、
      # 产业估值、人工 SMC 注册、多账本事实评分、唯一 paper 成交引擎、
      # 结算复盘与带证据的人类确认/争议;不触碰生产账本。
      - name: Offline U4-to-paper research cycle
        run: |
          python3 tests/test_paper_execution_realism.py
          python3 tests/test_paper_execution_audit.py
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/paper_execution_audit_v1.task.json
          python3 tests/test_research_method.py
          python3 tests/test_research_cycle.py
      # 终局 paper cycle 五轴归因:thesis/valuation/timing/execution/market beta
      # 独立判定;beta 从冻结样本重算,相对收益不得升格为 alpha。
      - name: Offline five-axis paper-cycle attribution
        run: python3 tests/test_five_axis_attribution.py
      # U4 decision ledger contract only: closed decision enum, rejected-sample
      # retention, append-only revision shape, and no trade/production authority.
      - name: U4 decision ledger specification (offline)
        run: |
          python3 tests/test_u4_decision_ledger_spec.py
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/u4_decision_ledger_spec_v1.task.json
      # U4 pre-decision packet: same-day U1-U3 evidence is prepared for
      # Junyan review, while machine selection/trade/paper-order authority stays
      # closed and source/diagnostic blockers remain visible.
      - name: U4 pre-decision packet contract (offline)
        run: python3 tests/test_u4_pre_decision_packet.py
      # Frozen assembly contract over the existing funnel, U4, research method,
      # paper execution, and five-axis modules. This step adds no runtime wiring.
      - name: Research closed loop V1 assembly contract (offline)
        run: |
          python3 tests/test_research_closed_loop_v1.py
          python3 scripts/llm/ai_os/cli.py compile --input scripts/llm/fixtures/research_closed_loop_v1.task.json
      # Research quality scorecard: scores research craft quality, not P&L,
      # alpha, trade readiness, U4 selection, or production authority.
      - name: Research quality scorecard contract (offline)
        run: python3 tests/test_research_quality_scorecard.py
      # Rerun operator checklist: same-day semiconductor reruns must stop on
      # source, diagnostic, U3, red-flag, sample-denominator, or authority gaps
      # before any U4 handoff.
      - name: Semiconductor same-day rerun checklist (offline)
        run: python3 tests/test_semiconductor_rerun_checklist.py
      # ── Macro OS M0-A:源身份/事件分级/双时间点预判/共识冲突语义 ──
      - name: Macro OS M0-A contract selftest
        run: python3 experiments/macro_os/contracts.py --selftest
      - name: Macro OS M0-A adversarial contract regression
        run: python3 tests/test_macro_contracts_offline.py
      # ── Macro OS M0-B:不可覆盖历史仓 + 官方采集器 + 来源绑定 + freshness ──
      - name: Macro OS M0-B storage and collector regression (offline)
        run: python3 tests/test_macro_m0b_offline.py
      # ── Macro OS M0-B2:其余官方适配器 + 日历快照 + 双源共识门 ──
      - name: Macro OS M0-B2 official-release and consensus regression (offline)
        run: python3 tests/test_macro_m0b2_offline.py
      # ── Macro OS M1-A:双区域状态机 + MRG + PIT/manifest 闸门 ──
      - name: Macro OS M1-A state and MRG regression (offline)
        run: python3 tests/test_macro_m1a_offline.py
      # ── Macro OS M1-B:行业敏感度 + 组合暴露 + 只读面板 ──
      - name: Macro OS M1-B industry and portfolio consumers (offline)
        run: python3 tests/test_macro_m1b_offline.py
      # ── Macro OS M1-C:夜链接线 + 同轮输入 + 原子发布清单 + 校准权限 ──
      - name: Macro OS M1-C production wiring (offline)
        run: python3 tests/test_macro_m1c_offline.py
      # ── Macro OS M0-B3:官方 URL 发现 + 自适应调度 + 预期登记 WAL ──
      - name: Macro OS M0-B3 discovery and scheduler regression (offline)
        run: python3 tests/test_macro_m0b3_offline.py
      # Governance gates are not delivered until a precise no-op mutation makes
      # the corresponding behavioral suite fail. The runner works in a temp
      # copy, strips secrets, blocks sockets, and rejects infrastructure-red as
      # a fake mutation kill.
      - name: Macro and AIOS governance mutation gate (offline)
        run: |
          python3 tests/test_governance_mutation_gate.py
          python3 scripts/governance_mutation_gate.py
      # 既有缺口(#215 复核发现):本文件逐个点名执行测试,无发现机制,
      # 故新增测试若不在此登记就永远不跑。以下两条此前从未在 CI 运行过。
      - name: PIT no-look-ahead regression
        run: python3 tests/test_pit_no_look_ahead.py
      # ── R-015 不可篡改事件账本(C5 §6.2 硬前置)──
      # 三层:①哈希链(改写/中删/换序/坏行)②锚点(尾部截断——链证明抓不到)
      # ③git 行前缀(整份重写但自洽)。selftest 对每一类篡改都断言"必须抓到"。
      - name: Event ledger selftest (tamper detection)
        run: python3 experiments/execution_tracker/event_ledger.py --selftest
      # 对提交进仓的真账本走三层校验。基准取 origin/main 而非 HEAD ——
      # 拿 HEAD 比等于跟自己比,永远相同,是个空转的检查。
      # PR 上这一步才有牙:任何改写/删除既有行的 PR 在这里就红。
      # (push 到 main 时 origin/main == HEAD,该层平凡满足,门在 PR 上。)
      # 基准必须随事件类型变 —— 上一版固定用 origin/main:
      #   PR 事件下若目标分支不是 main 就比错了对象;
      #   push 到 main 时 origin/main 就是刚推上去的那个提交 ⇒ 跟自己比 ⇒ 整步空转,
      #   而 push 触发器恰恰是为了挡 0712 那种直推 main 的形态。
      - name: Resolve append-only base ref
        id: base
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            # 全零 = 分支新建。main 已存在,出现全零属异常 ⇒ fail-closed,不静默放行。
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              echo "::error::push 事件的 before 为空或全零,无法确定 append-only 基准 —— fail-closed"
              exit 1
            fi
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          fi
      - name: Event ledger append-only verification
        run: python3 experiments/execution_tracker/event_ledger.py --ref "${{ steps.base.outputs.ref }}"
