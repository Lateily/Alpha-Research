name: python-ci
on:
  pull_request:
    paths:
      - "experiments/**/*.py"
      - "scripts/**/*.py"
      - "tests/**"
      - ".github/workflows/python-ci.yml"
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Offline deterministic tests (zero network)
        run: python3 tests/test_engines_offline.py
