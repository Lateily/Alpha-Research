name: nonprod-workbench-ui
on:
  pull_request:
    paths:
      - "tools/nonprod_workbench/**"
      - "tests/nonprod-workbench-trust-line.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nonprod-workbench-ci.yml"
  push:
    branches: [main]
    paths:
      - "tools/nonprod_workbench/**"
      - "tests/nonprod-workbench-trust-line.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/nonprod-workbench-ci.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/vite/bin/vite.js build --config tools/nonprod_workbench/vite.config.js
      - name: Trust line and run-quality display helpers (node)
        run: node tests/nonprod-workbench-trust-line.test.mjs
      - name: Pinned research metadata display and identity guards (node)
        run: node --test tests/nonprod-research-library.test.mjs
      - name: Actual shared component refresh and recovery (synthetic hooks)
        run: node --test tests/nonprod-research-library-component.test.mjs
      - name: Frozen research card client contracts (offline)
        run: node --test tests/nonprod-research-cards.test.mjs
      - name: Actual research card selection refresh and identity (synthetic hooks)
        run: node --test tests/nonprod-research-cards-component.test.mjs
